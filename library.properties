name=RunCamManagerLib
version=2.0.0
author=AttilaRibar
maintainer=AttilaRibar
sentence=Professional UART driver for RunCam cameras on ESP32 / ESP32-S3 (Arduino / PlatformIO).
paragraph=Implements the complete RunCam Device Protocol with CRC-8/DVB-S2: device info, camera control, 5-key OSD navigation (open/close, press, release), FC attitude exchange (command 0x50), and MSP DisplayPort text overlay (heartbeat, release, clear, write-string, draw, options). All fallible operations return a RunCamManagerStatus enum value. Hardware parameters are passed to begin(), not the constructor. Deterministic, fault-tolerant, JSF-AV-C++ style.
category=Communication
url=https://github.com/AttilaRibar/RunCamManagerLib
architectures=esp32
includes=RunCamManager.h
