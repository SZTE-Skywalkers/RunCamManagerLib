name=RunCamManagerLib
version=1.1.0
author=AttilaRibar
maintainer=AttilaRibar
sentence=Full UART interface library for RunCam cameras on ESP32-S3 (Arduino / PlatformIO).
paragraph=Implements the complete RunCam Device Protocol using CRC-8/DVB-S2: device info, camera control, 5-key OSD navigation (with connection open/close), flight data attitude overlay (roll/pitch/yaw sent to camera OSD via command 0x50), and background request handling via update().
category=Communication
