name=RunCamManagerLib
version=1.2.0
author=AttilaRibar
maintainer=AttilaRibar
sentence=Full UART interface library for RunCam cameras on ESP32-S3 (Arduino / PlatformIO).
paragraph=Implements the complete RunCam Device Protocol using CRC-8/DVB-S2: device info, camera control, 5-key OSD navigation (with connection open/close), flight data attitude overlay (roll/pitch/yaw via command 0x50), custom text OSD overlay via MSP DisplayPort (up to 10 numbered lines in the top-right corner), and background request handling via update().
category=Communication
url=https://github.com/AttilaRibar/RunCamManagerLib
architectures=esp32
includes=RunCamManager.h
